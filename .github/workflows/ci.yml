name: CI

on:
  push:
  pull_request:

# Read-only access is all the checks need.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # The tests use fake feed and model servers, so CI needs no API key.
      - run: python -m pytest
      - run: pip-audit -r requirements-dev.txt
